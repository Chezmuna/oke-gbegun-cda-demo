<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oke-Gbegun CDA Portal | Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2314213d'/%3E%3Cpath d='M41.9 22.1A14 14 0 1 0 41.9 41.9' fill='none' stroke='%23e8826a' stroke-width='7.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f9;--ink:#101828;--mute:#5a6475;--green:#14213d;--em:#2a6f97;--gold:#b9472c;--card:#fff;--line:#dde3ec;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}h2{font-size:26px;margin-bottom:6px}h3{font-size:18px;margin-bottom:10px}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}.mute{color:var(--mute)}.sm{font-size:14px}
.demo{background:var(--gold);color:#fff;font-size:13px;text-align:center;padding:5px 10px;font-weight:600}
.bar{background:var(--green);color:#f3f5f9;position:sticky;top:0;z-index:20}.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font:700 18px "Bricolage Grotesque",sans-serif;cursor:pointer}.brand small{display:block;font:400 12px "Instrument Sans";opacity:.75}
.btn{display:inline-block;background:var(--gold);color:#fff;border:1px solid var(--gold);border-radius:99px;padding:10px 20px;font-weight:600;text-decoration:none}.btn:hover{filter:brightness(1.06)}
.btn.alt{background:transparent;border-color:var(--line);color:var(--ink)}.bar .btn.alt,.dark .btn.alt{border-color:rgba(255,255,255,.4);color:#fff}.btn.s{padding:6px 14px;font-size:14px}.btn.red{background:#fff;border-color:#e3b3ae;color:#8a1c14}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:15px;color:var(--ink)}.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1fr 1fr}.mt{margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.kpi b{display:block;font:700 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}.kpi span{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.scroll{overflow-x:auto}.r{text-align:right}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}.ok{background:#dbeee3;color:#0e3b2c}.ok2{background:#e3e9f2;color:#1e3a5f}.warn{background:#fbecc6;color:#6b4a00}.bad{background:#f6d6d2;color:#8a1c14}
.bars .row{display:grid;grid-template-columns:96px 1fr 150px;gap:10px;align-items:center;margin:9px 0;font-size:14px}.track{background:#e3e8f0;border-radius:8px;height:14px;overflow:hidden}.fill{height:100%;background:var(--em);border-radius:8px}.fill.g{background:#d99a1e}.fill.d{background:#b3261e}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:80px}label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:50;padding:16px}.mbox{background:#fff;border-radius:18px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:22px}.mbox.w{max-width:680px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:36px 0 28px}.hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.03em}.hero h1 em{font:italic 400 1.05em Georgia,serif;color:var(--gold)}
.frame{border-radius:200px 200px 22px 22px;overflow:hidden;aspect-ratio:3/4;background:#1b2e57;box-shadow:0 30px 60px -30px rgba(20,33,61,.5)}.frame img{width:100%;height:100%;object-fit:cover;display:block}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;width:100%;color:var(--ink)}.opt.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.opt b{display:block}.opt span{font-size:13.5px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
pre{background:#101828;color:#d6e2f5;border-radius:10px;padding:12px;font-size:12.5px;overflow:auto;margin:8px 0 0}.big{font:700 34px "Bricolage Grotesque",sans-serif}.acct{font:700 28px "Bricolage Grotesque",sans-serif;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tip{background:#fdf0ea;border:1px solid #efc2b2;border-radius:12px;padding:12px 14px;font-size:14px}
@media(max-width:860px){.k4,.k3,.c2,.hero{grid-template-columns:1fr}.k4{grid-template-columns:1fr 1fr}.bars .row{grid-template-columns:70px 1fr}.bars .row span:last-child{grid-column:1/-1}.frame{max-width:300px}}
@media print{.demo,.bar,.tabs,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="demo noprint">DEMO: sample residents and figures modelled on the estate's ledger totals. No real resident names or phone numbers are used.</div>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>(n<0?'-':'')+'₦'+Math.round(Math.abs(n)).toLocaleString('en-NG');
const pad=n=>String(n).padStart(2,'0');
let seed=1;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const FIRST=['Adebayo','Chioma','Tunde','Ngozi','Ibrahim','Folake','Emeka','Aisha','Segun','Blessing','Kunle','Funke','Chidi','Yetunde','Musa','Bukola','Obinna','Temitope','Sade','Ifeanyi','Damilola','Kehinde','Rasheed','Amaka','Gbenga','Zainab','Femi','Nneka','Lekan','Hauwa'];
const LAST=['Adeyemi','Okafor','Bello','Eze','Balogun','Ogunleye','Nwosu','Lawal','Oladipo','Obi','Akinola','Chukwu','Salami','Adewale','Okoro','Yusuf','Ojo','Nnamdi','Alabi','Onyeka','Sanni','Ogundipe','Uche','Raji','Afolabi','Nwachukwu','Opara','Idowu','Mohammed','Taiwo'];
const TYPES=[['Flat',2000,215],['Self-contain',1500,145],['Bungalow',3000,35],['Shop',500,17],['Duplex',4000,16],['Commercial',5000,7],['Hotel / factory',10000,1],['Faith centre',120000,1]];
const FEE=Object.fromEntries(TYPES.map(t=>[t[0],t[1]]));
const ROADS=[['A',.14],['B',.1],['C',.14],['D',.07],['E',.08],['F',.14],['G',.07],['H',.12],['Clsd A',.06],['Clsd B',.04],['Clsd C',.04]];
const RN=ROADS.map(r=>r[0]),NM=5,MON=['Jan','Feb','Mar','Apr','May'];
let S;
function build(){
  seed=20260521;const ty=[];TYPES.forEach(([t,f,n])=>{for(let i=0;i<n;i++)ty.push([t,f])});
  for(let i=ty.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ty[i],ty[j]]=[ty[j],ty[i]]}
  const ac=ty.map(([t,f],i)=>{let r=rnd(),a=0,road='A';for(const [n,w] of ROADS){a+=w;if(r<=a){road=n;break}}
    return{id:i+1,type:t,fee:f,road,name:FIRST[Math.floor(rnd()*30)]+' '+LAST[Math.floor(rnd()*30)],role:rnd()<.35?'Landlord':'Tenant'}});
  const cnt={};ac.forEach(a=>cnt[a.road]=(cnt[a.road]||0)+1);
  ac.forEach(a=>{a.house=1+Math.floor(rnd()*Math.max(3,Math.round(cnt[a.road]/2.5)));a.ps=String(9000000000+a.id*7919);a.mn=String(6000000000+a.id*6143)});
  ac.forEach(a=>{if(a.type==='Faith centre'){a.bf=0;a.name='Sample Faith Centre';a.role='Landlord';return}
    const r=rnd();let k;if(r<.12)k=0;else if(r<.22)k=-(1+Math.floor(rnd()*3));else k=Math.min(40,1+Math.round(-Math.log(1-rnd())*7));a.bf=a.fee*k});
  const neg=ac.reduce((s,a)=>s+(a.bf<0?a.bf:0),0),pos=ac.reduce((s,a)=>s+(a.bf>0?a.bf:0),0),fc=(7075900-neg)/pos;
  ac.forEach(a=>{if(a.bf>0)a.bf=Math.max(a.fee,Math.round(a.bf*fc/500)*500)});
  const pays=[];let pid=1;const ref=()=>'OGN-'+(100000+Math.floor(rnd()*899999));
  const W=[.147,.323,.292,.154,.084],pm=()=>{let r=rnd(),a=0;for(let i=0;i<5;i++){a+=W[i];if(r<=a)return i}return 4};
  const fa=ac.find(a=>a.type==='Faith centre');[0,1,3].forEach(m=>pays.push({id:pid++,acct:fa.id,m,amt:120000,via:'Bank transfer',ref:ref()}));
  const oth=ac.filter(a=>a!==fa);for(let i=oth.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[oth[i],oth[j]]=[oth[j],oth[i]]}
  const py=oth.slice(0,85),mm=[12,12,12,12,12,6,6,3,3,2,1,1],raw=py.map(a=>a.fee*mm[Math.floor(rnd()*12)]),f2=1856500/raw.reduce((s,x)=>s+x,0);
  py.forEach((a,i)=>pays.push({id:pid++,acct:a.id,m:pm(),amt:Math.max(500,Math.round(raw[i]*f2/500)*500),via:rnd()<.7?'Bank transfer':'Cash (security manager)',ref:ref()}));
  pays.sort((a,b)=>a.m-b.m);
  S={ac,pays,pid,ev:[],claims:[],pend:[],msgs:[],stmt:null,modal:null,view:'landing',sub:'events',q:'',road:'',st:'',page:0,amtSel:'bal',custom:'',gw:'ps-co',ch:'card',rcpt:1001,
    notices:[{id:1,title:'General meeting: Saturday 30 May, 4:00 pm',type:'Meeting',body:'Venue: estate gate hall. Agenda: security levy arrears, streetlight repairs and guard welfare.',going:false},
      {id:2,title:'Security levy: pay and check your balance online',type:'Levy',body:'Residents can now see their account, pay any amount and download receipts from this portal.',going:false},
      {id:3,title:'Reminder: keep the road drains clear',type:'General',body:'Please do not dump refuse in the drains ahead of the rainy season.',going:false}]};
  const me=ac.find(a=>a.type==='Flat'&&bal(a)>=5*a.fee&&bal(a)<=9*a.fee)||ac[0];me.name='Demo Resident';me.role='Tenant';S.me=me.id;
  S.msgs.push({t:'Reminder',d:'20 May',b:'Dear Demo Resident, your Oke-Gbegun CDA security levy balance is '+N(bal(me))+'. Pay online any time. Thank you.'});
}
const acct=id=>S.ac.find(a=>a.id===id),paidOf=a=>S.pays.reduce((s,p)=>p.acct===a.id?s+p.amt:s,0),bal=a=>a.bf+a.fee*NM-(S?paidOf(a):0);
const code=a=>a.road+' / '+a.house;
function st(a){const b=bal(a),m=b/a.fee;return b<=0?['Up to date','ok']:m<=3?['Current','ok2']:m<=12?['Overdue','warn']:['Chronic','bad']}
function stats(){const B=S.ac.map(a=>bal(a)),billed=S.ac.reduce((s,a)=>s+a.fee,0),col=[0,0,0,0,0];S.pays.forEach(p=>col[p.m]+=p.amt);
  const coll=col.reduce((s,x)=>s+x,0),paidAcc=new Set(S.pays.map(p=>p.acct)).size,gross=B.reduce((s,b)=>s+(b>0?b:0),0),out=B.reduce((s,b)=>s+b,0);
  const ag={a:[0,0],b:[0,0],c:[0,0]};S.ac.forEach((a,i)=>{const b=B[i];if(b<=0)return;const m=b/a.fee,k=m<=3?'a':m<=12?'b':'c';ag[k][0]++;ag[k][1]+=b});
  const rd=RN.map(r=>{const L=S.ac.filter(a=>a.road===r),bl=L.reduce((s,a)=>s+a.fee*NM,0),c=S.pays.filter(p=>L.some(a=>a.id===p.acct)).reduce((s,p)=>s+p.amt,0);return{r,n:L.length,bl,c,o:L.reduce((s,a)=>s+bal(a),0)}});
  return{billed,due:billed*NM,col,coll,rate:coll/(billed*NM),paidAcc,gross,out,ag,rd,nopay:S.ac.length-paidAcc}}
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function post(a,amt,via,ch,gw){const p={id:S.pid++,acct:a.id,m:4,amt,via,ref:'OGN-'+(700000+S.pid),rc:'RC-'+(S.rcpt++)};S.pays.push(p);
  if(gw){const iso=new Date().toISOString(),n=S.pid;S.ev.unshift(gw==='ps'?{t:iso.slice(11,19),prov:'Paystack',type:'charge.success',amt,who:a.name,res:'Credited to '+code(a),
    json:{event:'charge.success',data:{id:5000000000+n,reference:p.ref,amount:amt*100,currency:'NGN',status:'success',channel:ch==='card'?'card':ch==='transfer'?'bank_transfer':'dedicated_nuban',paid_at:iso,customer:{email:'resident'+a.id+'@example.com'},metadata:{account_code:code(a)}}}}
    :{t:iso.slice(11,19),prov:'Monnify',type:'SUCCESSFUL_TRANSACTION',amt,who:a.name,res:'Credited to '+code(a),
    json:{eventType:'SUCCESSFUL_TRANSACTION',eventData:{product:{type:ch==='ra'?'RESERVED_ACCOUNT':'WEB_SDK',reference:p.ref},transactionReference:'MNFY|'+n+'|'+iso.slice(0,10),paymentReference:p.ref,paidOn:iso,amountPaid:amt,totalPayable:amt,paymentMethod:ch==='card'?'CARD':'ACCOUNT_TRANSFER',currency:'NGN',paymentStatus:'PAID',customer:{name:a.name,email:'resident'+a.id+'@example.com'}}}})}
  S.claims.forEach(c=>{if(c.s==='pending'&&c.acct===a.id&&c.amt===amt){c.s='confirmed by bank record'}});
  if(a.id===S.me)S.msgs.unshift({t:'Payment received',d:'Today',b:'Thank you. We received '+N(amt)+' ('+via+'). Receipt '+p.rc+'. New balance: '+N(bal(a))+'.'});return p}
const need=()=>{const a=acct(S.me),b=bal(a);return S.amtSel==='bal'?(b>0?b:a.fee):S.amtSel==='c'?Number(S.custom)||0:Number(S.amtSel)*a.fee};
const pill=(t,c)=>'<span class="pill '+c+'">'+esc(t)+'</span>';
const act=(a,l,c='',d='')=>'<button class="btn '+c+'" data-act="'+a+'" '+d+'>'+l+'</button>';
function shell(role){return '<div class="bar noprint"><div class="wrap"><div class="brand" data-act="go" data-v="landing">Oke-Gbegun CDA Portal<small>Ogunshe Estate, Phase II · Ikorodu</small></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+
  act('go','Executive view','alt s','data-v="exec:dash"')+act('go','Resident view','alt s','data-v="res:acct"')+act('reset','Reset demo','alt s')+'</div></div></div>'}
const tabs=(L,cur)=>'<div class="tabs">'+L.map(([v,l])=>'<button class="tab '+(cur===v?'on':'')+'" data-act="go" data-v="'+v+'">'+l+'</button>').join('')+'</div>';
const ETABS=[['exec:dash','Dashboard'],['exec:res','Residents'],['exec:pay','Payments'],['exec:notice','Notices & reminders'],['exec:setup','Payment setup']];
const RTABS=[['res:acct','My account'],['res:pay','Pay dues'],['res:notice','Notices & messages']];
function landing(){return '<div class="wrap"><div class="hero"><div><p class="sm mute" style="margin:0 0 10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Estate CDA management portal</p><h1>Every resident’s dues, records and notices in <em>one place</em>.</h1>'+
  '<p class="mute" style="font-size:18px;margin:18px 0 24px;max-width:50ch">See how the executive tracks collections, arrears and reports, and how residents register, pay, check their balance and get reminders.</p>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap">'+act('go','Explore as executive','','data-v="exec:dash"')+act('go','Explore as resident','alt','data-v="res:acct"')+act('go','Register as a new resident','alt','data-v="register"')+'</div></div>'+
  '<div class="frame"><img src="estate-gate.jpg" alt="Estate entrance gate"></div></div>'+
  '<div class="grid k4"><div class="card"><h3>For residents</h3><p class="sm mute">Register, see your balance, pay online or by transfer, get receipts, reminders and meeting notices.</p></div><div class="card"><h3>For the executive</h3><p class="sm mute">Live collection rate, arrears by age, street-by-street report and one-click reminders.</p></div><div class="card"><h3>Automatic payment detection</h3><p class="sm mute">Payments are credited from bank or gateway records, never from a resident’s say-so.</p></div><div class="card"><h3>Pick your gateway</h3><p class="sm mute">Try Paystack and Monnify payment journeys side by side before the CDA decides.</p></div></div>'+
  '<div class="tip mt"><b>Suggested demo path (10 minutes):</b> 1) Executive dashboard. 2) Residents: open an account. 3) Switch to Resident, pay with each of the four gateway options. 4) Back in Executive, open Payments and watch the events arrive. 5) Load the sample bank statement and post the matches. 6) Compare options under Payment setup.</div></div>'}
function dash(){const s=stats(),M=990000,mx=M*1.05;let g='';
  for(let i=0;i<5;i++){const x=34+i*74,hb=M/mx*130,hc=s.col[i]/mx*130;g+='<rect x="'+x+'" y="'+(150-hb)+'" width="26" height="'+hb+'" rx="4" fill="#dfe5ee"/><rect x="'+(x+30)+'" y="'+(150-hc)+'" width="26" height="'+hc+'" rx="4" fill="#2a6f97"/><text x="'+(x+28)+'" y="168" text-anchor="middle" font-size="12" fill="#5a6475">'+MON[i]+'</text><text x="'+(x+43)+'" y="'+(144-hc)+'" text-anchor="middle" font-size="10" fill="#101828">'+Math.round(s.col[i]/1000)+'k</text>'}
  const A=s.ag,tot=A.a[1]+A.b[1]+A.c[1]||1,row=(l,v,c)=>'<div class="row"><span>'+l+'</span><div class="track"><div class="fill '+c+'" style="width:'+Math.round(v[1]/tot*100)+'%"></div></div><span>'+v[0]+' accounts · '+N(v[1])+'</span></div>';
  const rr=s.rd.filter(r=>r.n>=10).map(r=>({r:r.r,p:r.c/r.bl})).sort((a,b)=>a.p-b.p),ins=[
   '<b>'+s.nopay+' of '+S.ac.length+' accounts ('+Math.round(s.nopay/S.ac.length*100)+'%)</b> have paid nothing this year.',
   'Accounts more than 12 months behind hold <b>'+Math.round(A.c[1]/tot*100)+'%</b> of all arrears ('+N(A.c[1])+').',
   'Lowest collection: <b>'+rr[0].r+'</b> ('+Math.round(rr[0].p*100)+'%). Highest: <b>'+rr[rr.length-1].r+'</b> ('+Math.round(rr[rr.length-1].p*100)+'%).'];
  return tabs(ETABS,'exec:dash')+'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><h2>Executive dashboard</h2><p class="mute sm" style="margin:0">Reporting period Jan–May 2026 (sample data)</p></div>'+act('print','Print monthly report','alt s noprint')+'</div>'+
  '<div class="grid k4 mt"><div class="card kpi"><b>'+N(s.billed)+'</b><span>Billed per month</span></div><div class="card kpi"><b>'+N(s.coll)+'</b><span>Collected Jan–May of '+N(s.due)+'</span></div><div class="card kpi"><b>'+Math.round(s.rate*100)+'%</b><span>Collection rate</span></div><div class="card kpi"><b>'+N(s.out)+'</b><span>Outstanding (net of credits)</span></div></div>'+
  '<div class="grid c2 mt"><div class="card"><h3>Billed vs collected by month</h3><svg viewBox="0 0 400 178" width="100%" role="img" aria-label="Billed versus collected by month">'+g+'</svg><p class="sm mute" style="margin:0">Pale bar: billed. Blue bar: collected.</p></div>'+
  '<div class="card"><h3>Arrears by age</h3><div class="bars">'+row('Up to 3 months',A.a,'g')+row('3 to 12 months',A.b,'g')+row('Over 12 months',A.c,'d')+'</div><h3 style="margin-top:18px">What stands out</h3><ul style="margin:0;padding-left:18px">'+ins.map(i=>'<li>'+i+'</li>').join('')+'</ul></div></div>'+

 go:d=>{S.view=d.v;S.page=0;S.modal=null;render()},reset:()=>{const v='landing';build();render()},print:()=>window.print(),close:()=>{S.modal=null;render()},
 pg:d=>{S.page+=Number(d.d);$('#rt').innerHTML=rows()},sub:d=>{S.sub=d.v;render()},amt:d=>{S.amtSel=d.v;render()},gw:d=>{S.gw=d.v;render()},ch:d=>{S.ch=d.v;$('#modal').innerHTML=modal()},
 payGo:()=>{const n=need();if(n<500)return toast('Enter an amount of at least ₦500');S.ch='card';S.modal={t:S.gw,amt:n};$('#modal').innerHTML=modal()},
 doCard:d=>{const a=acct(S.me);done(a,S.modal.amt,(d.gw==='ps'?'Paystack':'Monnify')+' card','card',d.gw)},
 doTransfer:d=>{const a=acct(S.me);done(a,S.modal.amt,(d.gw==='ps'?'Paystack':'Monnify')+' bank transfer','transfer',d.gw)},
 doDva:d=>{const n=Number($('#tv').value);if(!(n>=500))return toast('Enter an amount of at least ₦500');done(acct(S.me),n,(d.gw==='ps'?'Paystack':'Monnify')+' personal account',d.gw==='mn'?'ra':'dva',d.gw)},
 doClaim:()=>{const n=Number($('#ca').value);if(!(n>=500))return toast('Enter an amount of at least ₦500');S.claims.unshift({acct:S.me,amt:n,snd:$('#cs').value||'-',ref:$('#cr').value||'-',s:'pending'});S.modal=null;render();toast('Notice sent. Balance unchanged until the bank record confirms it.')},
 view:d=>{S.modal={t:'view',id:Number(d.id)};$('#modal').innerHTML=modal()},
 cash:d=>{const n=Number($('#cashv').value);if(!(n>0))return;const a=acct(Number(d.id));post(a,n,'Cash (recorded by treasurer)');S.modal=null;render();toast('Cash payment recorded. Receipt issued.')},
 remOne:d=>{const a=acct(Number(d.id));if(a.id===S.me)S.msgs.unshift({t:'Reminder',d:'Today',b:'Dear '+a.name+', your balance is '+N(bal(a))+'. Pay online any time. Thank you.'});toast('Reminder sent to '+a.name)},
 remAll:()=>{const n=S.ac.filter(a=>bal(a)/a.fee>3).length,a=acct(S.me);if(bal(a)/a.fee>3)S.msgs.unshift({t:'Reminder',d:'Today',b:'Dear '+a.name+', your balance is '+N(bal(a))+'. Pay online any time. Thank you.'});toast('Reminders queued for '+n+' residents (demo)')},
 notice:()=>{const t=$('#nt').value.trim();if(!t)return toast('Add a title first');S.notices.unshift({id:Date.now(),title:t,type:$('#ny').value,body:$('#nb').value.trim()||'See the CDA executive for details.',going:false});render();toast('Notice published to all residents')},
 rsvp:d=>{const n=S.notices[Number(d.i)];n.going=!n.going;render()},
 reg:()=>{const n=$('#rn').value.trim(),h=$('#rh').value.trim();if(!n||!h||!$('#rp').value.trim())return $('#rm').innerHTML='<p class="sm" style="color:#b3261e">Please enter your name, phone number and house number.</p>';
  S.pend.push({name:n,road:$('#rr').value,house:h,type:$('#rt').value,role:$('#rl').value});$('#rm').innerHTML='<div class="tip">Thank you. Your registration has been sent to the executive for approval. In Executive view → Residents you can approve it.</div>'},
 apv:d=>{const p=S.pend.splice(Number(d.i),1)[0],id=Math.max(...S.ac.map(a=>a.id))+1;S.ac.push({id,type:p.type,fee:FEE[p.type],road:p.road,house:p.house,name:p.name,role:p.role,bf:0,ps:String(9000000000+id*7919),mn:String(6000000000+id*6143)});render();toast(p.name+' approved and added')},
 rej:d=>{S.pend.splice(Number(d.i),1);render()},
 stmtLoad:()=>{seed=77;const L=[],c=S.ac.filter(a=>bal(a)>0&&a.type!=='Faith centre');for(let i=c.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
  const dt=i=>(12+i)+' May 2026';c.slice(0,9).forEach((a,i)=>L.push({d:dt(i%9),n:a.name.toUpperCase(),r:'SEC LEVY '+code(a).replace(' / ','-'),m:a.fee*[1,2,3,6,12][i%5],a:a.id,s:'matched',why:'House code and sender name match'}));
  c.slice(9,12).forEach((a,i)=>{const cand=[a.id].concat(S.ac.filter(x=>x.id!==a.id&&x.name.split(' ')[0]===a.name.split(' ')[0]).slice(0,2).map(x=>x.id));if(cand.length<2)cand.push(c[20+i].id);L.push({d:dt(i+2),n:a.name.split(' ')[0].toUpperCase()+' '+'TRF',r:'security levy',m:a.fee*3,s:'review',c:cand})});
  [['UNKNOWN SENDER','gift'],['COMPANY LTD','payment']].forEach((x,i)=>L.push({d:dt(i+5),n:x[0],r:x[1],m:5000,s:'none'}));S.stmt=L;render()},
 stmtPost:()=>{let n=0;S.stmt.forEach(x=>{if(x.s==='matched'){post(acct(x.a),x.m,'Bank transfer (statement import)');x.s='posted';n++}});render();toast(n?n+' payments posted to resident accounts':'Nothing to post')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind&&t.tagName==='INPUT'){S[t.dataset.bind]=t.value;if(t.dataset.bind==='q'){S.page=0;$('#rt').innerHTML=rows()}else{const e=$('#amtv');if(e)e.textContent=N(need())}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.bind&&t.tagName==='SELECT'){S[t.dataset.bind]=t.dataset.bind==='me'?Number(t.value):t.value;S.page=0;t.dataset.bind==='me'?render():$('#rt').innerHTML=rows()}
  if(t.dataset.asg!==undefined&&t.value){const x=S.stmt[Number(t.dataset.asg)];x.a=Number(t.value);x.s='matched';x.why='Assigned by treasurer';render()}});
build();render();
})();
</script>
</body>
</html>
